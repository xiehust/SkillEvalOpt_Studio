# Codex CLI config baked into the AgentCore worker image.
# Bedrock-direct: SigV4 credentials come from the runtime execution role.
# The harness passes the model per invocation via `-m`.
model = "openai.gpt-5.6-sol"
model_provider = "amazon-bedrock"
model_catalog_json = "/home/agent/.codex/model-catalogs/bedrock-models.json"

[model_providers.amazon-bedrock.aws]
region = "us-west-2"

[projects."/mnt/workspace"]
trust_level = "trusted"

[projects."/tmp"]
trust_level = "trusted"
